<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Product review submission form for users.">
    <meta name="author" content="Galo Salas">
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">

            <!-- Dynamic Select Field -->
            <fieldset>
                <legend>Product Information</legend>
                <label for="productName">Product Name *</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Options injected by JavaScript -->
                </select>
            </fieldset>

            <!-- Radio Buttons for Rating -->
            <fieldset>
                <legend>Overall Rating *</legend>
                <div class="rating-group">
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">1 ☆</label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2">2 ☆</label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3">3 ☆</label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4">4 ☆</label>

                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">5 ☆</label>
                </div>
            </fieldset>

            <!-- Date Input -->
            <fieldset>
                <legend>Installation</legend>
                <label for="installDate">Date of Installation *</label>
                <input type="date" id="installDate" name="installDate" required>
            </fieldset>

            <!-- Checkboxes for Features -->
            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>
                <div class="checkbox-group">
                    <input type="checkbox" id="featDesign" name="features" value="design">
                    <label for="featDesign">Design</label><br>

                    <input type="checkbox" id="featDurability" name="features" value="durability">
                    <label for="featDurability">Durability</label><br>

                    <input type="checkbox" id="featEase" name="features" value="easeOfUse">
                    <label for="featEase">Ease of Use</label><br>

                    <input type="checkbox" id="featPerformance" name="features" value="performance">
                    <label for="featPerformance">Performance</label>
                </div>
            </fieldset>

            <!-- Textarea and Optional Text Input -->
            <fieldset>
                <legend>Additional Feedback</legend>
                <label for="writtenReview">Written Review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>

                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </fieldset>

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Galo Salas | WDD 131</p>
    </footer>

    <script src="scripts/form.js"></script>
</body>

</html>
